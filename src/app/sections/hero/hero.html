<section id="top" class="pb-14 pt-14 sm:pb-20 sm:pt-20 lg:pb-24 lg:pt-24">
  <div
    class="section-container grid items-end gap-8 xl:grid-cols-[minmax(0,8fr)_minmax(0,3fr)] xl:gap-10"
  >
    <h1 class="hero-name">
      <span>{{ givenName }}&ngsp;</span>
      <span>{{ familyName }}</span>
    </h1>
    <div class="max-w-sm space-y-3">
      <p class="font-display text-xl font-semibold leading-tight sm:text-2xl">
        {{ 'hero.roleTag' | transloco }}
      </p>
      <p class="leading-relaxed text-muted">
        {{ 'hero.description' | transloco }}
      </p>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-2 pt-2">
        <a href="#projects" class="primary-link gap-2">
          {{ 'hero.projectsCta' | transloco }}
          <svg
            class="size-5 shrink-0"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <use href="/icons/tabler-outline.svg#arrow-down-right"></use>
          </svg>
        </a>
        <a href="#experience" class="text-link">
          {{ 'hero.experienceCta' | transloco }}
        </a>
      </div>
    </div>
  </div>
</section>
