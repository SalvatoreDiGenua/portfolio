<footer class="border-t border-emerald-line bg-ink py-6 text-emerald-soft">
  <div
    class="section-container flex flex-wrap items-center justify-between gap-x-8 gap-y-2 text-sm"
  >
    <div>
      <p class="mt-1">{{ 'footer.built' | transloco }}</p>
    </div>
    <div class="flex flex-wrap gap-x-6">
      <a
        href="https://github.com/SalvatoreDiGenua/portfolio"
        target="_blank"
        rel="noopener noreferrer"
        class="text-link"
        [attr.aria-label]="'footer.ariaSourceCode' | transloco"
      >
        {{ 'footer.sourceCode' | transloco }}
      </a>
      <a
        [href]="profile.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        class="text-link"
        [attr.aria-label]="'footer.ariaLinkedIn' | transloco"
      >
        {{ 'footer.linkedin' | transloco }}
      </a>
    </div>
  </div>
</footer>
