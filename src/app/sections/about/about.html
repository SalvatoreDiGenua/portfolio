<section
  id="about"
  class="section-space border-b border-line"
  aria-labelledby="about-title"
>
  <div class="section-container section-split">
    <div>
      <h2 id="about-title" class="section-heading">
        {{ 'about.title' | transloco }}
      </h2>
      <p class="mt-4 text-muted">{{ profile.location }}</p>
    </div>
    <div>
      <p class="max-w-prose text-lg leading-relaxed">
        {{ profile.summary | transloco }}
      </p>
      <a
        [href]="profile.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        class="text-link mt-3 text-emerald"
        [attr.aria-label]="'about.ariaLinkedIn' | transloco"
      >
        LinkedIn
      </a>
      <dl
        class="mt-5 grid grid-cols-3 gap-3 border-t border-line pt-5 sm:gap-6"
      >
        @for (stat of stats; track stat.key) {
          <div class="flex flex-col-reverse">
            <dt class="mt-1 text-sm text-muted">{{ stat.key | transloco }}</dt>
            <dd
              class="font-display text-3xl font-semibold tabular-nums text-emerald sm:text-4xl"
            >
              {{ stat.value }}
            </dd>
          </div>
        }
      </dl>
    </div>
  </div>
</section>
