<header
  class="fixed inset-x-0 top-0 z-50 border-b border-white/5 bg-ink-950/80 backdrop-blur-lg"
>
  <nav class="section-container flex h-16 items-center justify-between">
    <a href="#top" class="font-mono text-lg font-bold text-white"
      ><span class="text-primary-400">&lt;</span>SDG<span
        class="text-primary-400"
        >/&gt;</span
      ></a
    >

    <ul class="hidden items-center gap-8 md:flex">
      @for (link of links; track link.href) {
        <li>
          <a
            [href]="link.href"
            class="text-sm font-medium text-slate-300 transition-colors hover:text-primary-400"
          >
            {{ link.key | transloco }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-3">
      <button
        type="button"
        class="chip cursor-pointer uppercase transition-colors hover:border-primary-400 hover:text-primary-300"
        (click)="toggleLanguage()"
        [attr.aria-label]="'Switch language'"
      >
        {{ languageService.language() }}
      </button>

      <a
        href="#contact"
        class="btn-primary !px-5 !py-2 text-xs hidden md:block"
      >
        {{ 'nav.contactMe' | transloco }}
      </a>

      <button
        type="button"
        class="inline-flex items-center justify-center rounded-lg border border-white/10 p-2 text-slate-200 md:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isOpen()"
        aria-label="Apri il menu di navigazione"
      >
        @if (!isOpen()) {
          <span class="text-xl">☰</span>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        }
      </button>
    </div>
  </nav>

  @if (isOpen()) {
    <div class="border-t border-white/5 bg-ink-950/95 px-6 py-4 md:hidden">
      <ul class="flex flex-col gap-4">
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="link.href"
              class="block text-sm font-medium text-slate-300 hover:text-primary-400"
              (click)="closeMenu()"
              >{{ link.key | transloco }}</a
            >
          </li>
        }
      </ul>
    </div>
  }
</header>
