<header class="sticky top-0 z-50 border-b border-line bg-paper">
  <nav
    class="site-nav section-container flex items-center justify-between gap-4"
    [attr.aria-label]="'nav.ariaMain' | transloco"
  >
    <a
      [href]="languageService.sectionHref('#top')"
      class="nav-link font-display text-3xl font-bold tracking-tight"
      [attr.aria-label]="'nav.ariaHome' | transloco"
      (click)="closeMenu()"
    >
      SDG
    </a>
    <ul class="ml-auto hidden items-center gap-5 text-sm lg:flex xl:gap-8">
      @for (link of links; track link.href) {
        <li>
          <a [href]="languageService.sectionHref(link.href)" class="nav-link">
            {{ link.key | transloco }}
          </a>
        </li>
      }
    </ul>
    <div class="flex items-center gap-2 lg:ml-4">
      <a
        [href]="languageService.alternatePath()"
        [attr.hreflang]="languageService.alternateLanguage()"
        class="nav-link px-2 text-sm"
        (click)="toggleLanguage($event)"
        aria-describedby="language-switch-hint"
      >
        <span [class.font-bold]="languageService.language() === 'it'">IT</span>
        <span class="px-1 text-muted">&ngsp;/&ngsp;</span>
        <span [class.font-bold]="languageService.language() === 'en'">EN</span>
      </a>
      <span id="language-switch-hint" class="sr-only">
        {{ 'nav.ariaLangSwitch' | transloco }}
      </span>
      <button
        #menuButton
        type="button"
        class="inline-flex min-h-11 min-w-11 items-center justify-center border border-line lg:hidden"
        (click)="toggleMenu()"
        (keydown.escape)="closeMenuWithFocus(menuButton)"
        aria-controls="site-menu"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-label]="
          (isOpen() ? 'nav.ariaCloseMenu' : 'nav.ariaOpenMenu') | transloco
        "
      >
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          aria-hidden="true"
        >
          @if (isOpen()) {
            <path d="m6 6 12 12M18 6 6 18" />
          } @else {
            <path d="M4 8h16M4 16h16" />
          }
        </svg>
      </button>
    </div>
    <div
      id="site-menu"
      class="absolute inset-x-0 top-full max-h-[calc(100dvh-var(--nav-height))] overflow-y-auto border-y border-line bg-paper lg:hidden"
      [hidden]="!isOpen()"
    >
      <ul class="section-container py-3">
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="languageService.sectionHref(link.href)"
              class="nav-link w-full"
              (click)="closeMenu()"
              (keydown.escape)="closeMenuWithFocus(menuButton)"
            >
              {{ link.key | transloco }}
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>
</header>
