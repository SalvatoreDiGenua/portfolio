<section
  id="education"
  class="relative border-t border-white/[0.06] bg-ink-900/40 py-24 sm:py-32"
>
  <div class="section-container relative z-10">
    <div class="mb-12 flex flex-col gap-2">
      <span class="section-label">
        <span class="h-1.5 w-1.5 rounded-full bg-brand-400"></span>
        {{ 'education.label' | transloco }}
      </span>
      <h2 class="text-3xl sm:text-4xl lg:text-5xl">
        {{ 'education.title' | transloco }}
      </h2>
    </div>
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (item of education; track item.key) {
        <div
          class="card flex flex-col justify-between"
          [class.card-highlight]="item.key === 'education.items.master'"
        >
          <div>
            <div class="flex items-start justify-between gap-2 mb-3">
              <span
                class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-brand-500/10 text-brand-400 border border-brand-500/20"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  aria-hidden="true"
                >
                  <path d="M12 14l9-5-9-5-9 5 9 5z" />
                  <path
                    d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"
                  />
                </svg>
              </span>
              <span
                class="font-mono text-xs uppercase tracking-widest text-brand-400 font-semibold px-2.5 py-0.5 rounded-md bg-brand-500/10 border border-brand-500/20"
              >
                {{ item.key + '.period' | transloco }}
              </span>
            </div>
            <h3 class="text-lg font-bold text-white tracking-tight">
              {{ item.key + '.title' | transloco }}
            </h3>
            <p class="mt-2 text-sm text-slate-400 font-medium">
              {{ item.key + '.institution' | transloco }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
