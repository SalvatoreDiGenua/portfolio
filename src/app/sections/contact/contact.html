<section id="contact" class="py-24 sm:py-32">
  <div class="section-container">
    <div class="relative overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-br from-ink-800 via-ink-900 to-ink-950 p-10 text-center sm:p-16">
      <div class="pointer-events-none absolute -right-16 -top-16 h-64 w-64 rounded-full bg-primary-600/20 blur-[100px]"></div>

      <span class="section-label">05 — Contatti</span>
      <h2 class="mt-3 text-3xl sm:text-4xl">Parliamo del tuo prossimo progetto</h2>
      <p class="mx-auto mt-4 max-w-xl text-slate-400">
        Sono disponibile per collaborazioni come consulente frontend, sviluppatore Angular o per ruoli di team leadership.
      </p>

      <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
        <a [href]="'mailto:' + profile.email" class="btn-primary">
          {{ profile.email }}
        </a>
        <a [href]="'tel:' + profile.phone" class="btn-secondary">
          {{ profile.phone }}
        </a>
      </div>

      <div class="mt-8 flex items-center justify-center gap-2 text-sm text-slate-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        {{ profile.location }}
      </div>
    </div>
  </div>
</section>
