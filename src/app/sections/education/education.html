<section id="education" class="section-space" aria-labelledby="education-title">
  <div class="section-container">
    <h2 id="education-title" class="section-heading mb-8">
      {{ 'education.title' | transloco }}
    </h2>
    <ul class="grid gap-x-8 gap-y-6 lg:grid-cols-3">
      @for (item of education; track item.key) {
        <li class="border-t border-line pt-4">
          <p class="text-sm font-bold tabular-nums text-emerald">
            {{ item.key + '.period' | transloco }}
          </p>
          <h3 class="mt-2 text-2xl font-semibold leading-tight">
            {{ item.key + '.title' | transloco }}
          </h3>
          <p class="mt-2 text-muted">
            {{ item.key + '.institution' | transloco }}
          </p>
        </li>
      }
    </ul>
  </div>
</section>
