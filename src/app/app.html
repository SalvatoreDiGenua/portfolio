<a [href]="languageService.sectionHref('#main-content')" class="skip-link">
  {{ 'nav.skipToContent' | transloco }}
</a>

<app-navbar />

<main id="main-content" tabindex="-1">
  <app-hero />
  <app-about />
  <app-projects />
  @defer (
    on viewport;
    hydrate on viewport;
    hydrate when languageService.hasChangedLanguage()
  ) {
    <app-ai />
  } @placeholder {
    <div id="ai" class="min-h-96" aria-hidden="true"></div>
  }
  @defer (
    on viewport;
    hydrate on viewport;
    hydrate when languageService.hasChangedLanguage()
  ) {
    <app-experience />
  } @placeholder {
    <div id="experience" class="min-h-96" aria-hidden="true"></div>
  }
  <app-skills />
  <app-education />
  <app-contact />
</main>

<app-footer />
