<section
  id="contact"
  class="section-space bg-ink text-emerald-foreground"
  aria-labelledby="contact-title"
>
  <div class="section-container section-split items-center">
    <div>
      <h2 id="contact-title" class="section-heading">
        {{ 'contact.title' | transloco }}
      </h2>
      <svg
        class="section-illustration section-illustration--dark"
        viewBox="0 0 360 232"
        width="360"
        height="232"
        aria-hidden="true"
        focusable="false"
      >
        <use href="/illustrations/portfolio-sections.svg#contact"></use>
      </svg>
    </div>
    <div class="bg-emerald p-5 sm:p-8">
      <p class="max-w-prose text-lg leading-relaxed text-emerald-soft">
        {{ 'contact.description' | transloco }}
      </p>
      <div class="mt-5 flex flex-wrap items-center gap-x-6 gap-y-2">
        <a
          [href]="'mailto:' + profile.email"
          class="primary-link gap-2 focus-visible:outline-emerald-foreground"
          [attr.aria-label]="'contact.ariaMail' | transloco"
        >
          <svg
            class="size-5 shrink-0"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <use href="/icons/tabler-outline.svg#mail"></use>
          </svg>
          {{ 'nav.contactMe' | transloco }}
        </a>
        <a
          [href]="profile.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          class="text-link"
          [attr.aria-label]="'contact.ariaLinkedIn' | transloco"
        >
          LinkedIn
        </a>
      </div>
      <a
        [href]="'mailto:' + profile.email"
        class="text-link mt-2 break-all text-sm text-emerald-soft"
      >
        {{ profile.email }}
      </a>
    </div>
  </div>
</section>
