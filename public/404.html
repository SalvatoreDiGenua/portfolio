<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f2f7f5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Page not found | Salvatore Di Genua</title>
    <style>
      :root {
        --paper: #f2f7f5;
        --ink: #10241e;
        --emerald: #064e3b;
        --lime: #d9f99d;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }

      main {
        max-width: 40rem;
        margin-inline: auto;
        padding: clamp(3rem, 12vh, 8rem) 1.25rem;
      }

      h1 {
        margin-block: 0 0.25em;
        font-size: clamp(2.5rem, 7vw, 4rem);
        line-height: 1;
      }

      a {
        color: var(--emerald);
        font-weight: 700;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid var(--emerald);
        outline-offset: 4px;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.25rem;
        margin-block-start: 1.75rem;
      }

      .home {
        padding: 0.65rem 1rem;
        background: var(--lime);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        The page may have moved. You can find the current projects on the
        portfolio.
      </p>
      <div class="links">
        <a class="home" href="/">Go to the portfolio</a>
        <a href="/it/" lang="it" hreflang="it">Versione italiana</a>
      </div>
    </main>
  </body>
</html>
