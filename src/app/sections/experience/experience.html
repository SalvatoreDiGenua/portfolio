<section id="experience" class="py-24 sm:py-32">
  <div class="section-container">
    <div class="mb-12 flex flex-col gap-2">
      <span class="section-label">03 — Esperienza</span>
      <h2 class="text-3xl sm:text-4xl">Percorso professionale</h2>
    </div>

    <div class="relative border-l border-white/10 pl-8">
      @for (exp of experiences; track exp.company) {
        <div class="relative mb-12 last:mb-0">
          <span class="absolute -left-[41px] top-1.5 h-3 w-3 rounded-full border-2 border-primary-400 bg-ink-950"></span>

          <div class="card">
            <div class="flex flex-col justify-between gap-1 sm:flex-row sm:items-baseline">
              <h3 class="text-xl font-semibold text-white">{{ exp.role }}</h3>
              <span class="font-mono text-xs uppercase tracking-widest text-primary-400">{{ exp.period }}</span>
            </div>
            <p class="mt-1 font-medium text-accent-500">{{ exp.company }}</p>
            <p class="mt-4 text-sm leading-relaxed text-slate-400">{{ exp.description }}</p>

            <div class="mt-4 flex flex-wrap gap-2">
              @for (tag of exp.tags; track tag) {
                <span class="chip">{{ tag }}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
