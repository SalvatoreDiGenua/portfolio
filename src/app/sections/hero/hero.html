<section
  id="top"
  class="relative flex min-h-screen items-center justify-center bg-grid-pattern bg-[size:32px_32px] pt-24"
>
  <div
    class="pointer-events-none absolute inset-0 bg-gradient-to-b from-primary-900/20 via-transparent to-ink-950"
  ></div>
  <div
    class="pointer-events-none absolute left-1/2 top-1/3 h-[420px] w-[420px] -translate-x-1/2 rounded-full bg-primary-600/20 blur-[120px]"
  ></div>
  <div
    class="section-container relative z-10 flex flex-col items-center text-center"
  >
    <span
      class="chip mb-6 border-primary-500/30 bg-primary-500/10 text-primary-300"
    >
      {{ 'hero.availability' | transloco }}
    </span>
    <h1 class="text-4xl font-extrabold leading-tight sm:text-5xl md:text-6xl">
      {{ 'hero.greeting' | transloco }}
      <span class="text-primary-400">{{ profile.name }}</span>
    </h1>
    <p class="mt-4 max-w-2xl text-lg font-medium text-slate-300 sm:text-xl">
      {{ profile.title }}
    </p>
    <p class="mt-1 font-mono text-sm uppercase tracking-widest text-accent-500">
      {{ profile.subtitle }}
    </p>
    <p class="mt-6 max-w-2xl text-base leading-relaxed text-slate-400">
      {{ 'hero.description' | transloco }}
    </p>
    <div class="mt-10 flex flex-col gap-4 sm:flex-row">
      <a href="#contact" class="btn-primary">
        {{ 'nav.contactMe' | transloco }}
      </a>
      <a href="#experience" class="btn-secondary">
        {{ 'hero.experienceCta' | transloco }}
      </a>
    </div>
    <div class="mt-14 flex items-center gap-3 text-slate-500">
      <span class="text-xs font-mono uppercase tracking-widest">
        {{ 'hero.scroll' | transloco }}
      </span>
      <span aria-hidden="true">↓</span>
    </div>
  </div>
</section>
