<footer class="border-t border-white/5 bg-ink-950 py-8">
  <div
    class="section-container flex flex-col items-center justify-between gap-6 text-sm text-slate-500 sm:flex-row sm:justify-between"
  >
    <div
      class="flex flex-col items-center gap-2 text-center sm:items-start sm:text-left"
    >
      <p>
        &copy; {{ year }} {{ profile.name }}. {{ 'footer.rights' | transloco }}
      </p>
      <span class="font-mono text-xs text-slate-600">
        {{ 'footer.built' | transloco }}
      </span>
    </div>

    <div class="flex items-start flex-row gap-4 sm:flex-col">
      <a
        href="https://github.com/SalvatoreDiGenua/portfolio"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 text-slate-400 transition-colors hover:text-white"
      >
        <img
          src="https://s.magecdn.com/social/mw-github.svg"
          alt=""
          aria-hidden="true"
          class="h-4 w-4"
        />
        {{ 'footer.sourceCode' | transloco }}
      </a>

      <a
        [href]="profile.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 text-slate-400 transition-colors hover:text-white"
      >
        <img
          src="https://s.magecdn.com/social/mw-linkedin.svg"
          alt=""
          aria-hidden="true"
          class="h-4 w-4"
        />
        {{ 'footer.linkedin' | transloco }}
      </a>
    </div>
  </div>
</footer>
