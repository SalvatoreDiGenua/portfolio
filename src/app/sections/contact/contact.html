<section id="contact" class="relative py-24 sm:py-32">
  <div class="section-container relative z-10">
    <div class="relative overflow-hidden rounded-3xl border border-brand-500/25 bg-gradient-to-b from-ink-850 via-ink-900 to-ink-950 p-10 text-center sm:p-16 shadow-2xl backdrop-blur-2xl">
      <div class="pointer-events-none absolute -right-20 -top-20 h-72 w-72 rounded-full bg-brand-500/20 blur-[120px]" aria-hidden="true"></div>
      <div class="pointer-events-none absolute -left-20 -bottom-20 h-72 w-72 rounded-full bg-accent-500/15 blur-[120px]" aria-hidden="true"></div>
      <span class="section-label"><span class="h-1.5 w-1.5 rounded-full bg-brand-400"></span>{{ 'contact.label' | transloco }}</span>
      <h2 class="mt-4 text-3xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight">{{ 'contact.title' | transloco }}</h2>
      <p class="mx-auto mt-4 max-w-xl text-base sm:text-lg text-slate-300">{{ 'contact.description' | transloco }}</p>
      <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
        <a [href]="'mailto:' + profile.email" class="btn-primary min-h-[48px] !px-8 text-base shadow-glow-brand">
          <img src="https://s.magecdn.com/social/mw-mail.svg" alt="" aria-hidden="true" class="h-4 w-4" />
          <span>{{ 'nav.contactMe' | transloco }}</span>
        </a>
        <a [href]="profile.linkedin" target="_blank" rel="noopener noreferrer" class="btn-secondary min-h-[48px] !px-6 text-sm" aria-label="Connettiti con Salvatore Di Genua su LinkedIn (apre in una nuova scheda)">
          <img src="https://s.magecdn.com/social/mw-linkedin.svg" alt="" aria-hidden="true" class="h-4 w-4" />
          <span>LinkedIn</span>
        </a>
      </div>
      <div class="mt-10 flex flex-col items-center justify-center gap-2 text-xs font-mono text-slate-400 sm:flex-row">
        <div class="flex items-center gap-2"><span class="h-1.5 w-1.5 rounded-full bg-brand-400"></span><span>{{ profile.location }}</span></div>
        <span class="hidden text-white/20 sm:block">•</span>
        <a [href]="'mailto:' + profile.email" class="hover:text-white transition-colors underline underline-offset-4 decoration-brand-400/40">{{ profile.email }}</a>
      </div>
    </div>
  </div>
</section>
