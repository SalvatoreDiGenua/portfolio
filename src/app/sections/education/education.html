<section
  id="education"
  class="section-space bg-emerald-soft"
  aria-labelledby="education-title"
>
  <div class="section-container">
    <div class="mb-8 flex items-start gap-3 sm:items-center sm:gap-5">
      <svg
        class="mt-0.5 size-9 shrink-0 text-emerald sm:size-11"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <use href="/icons/tabler-outline.svg#school"></use>
      </svg>
      <h2 id="education-title" class="section-heading">
        {{ 'education.title' | transloco }}
      </h2>
    </div>
    <ul
      class="grid gap-px border border-emerald-line bg-emerald-line lg:grid-cols-3"
    >
      @for (item of education; track item.key) {
        <li class="bg-paper px-5 py-6 sm:px-6">
          <p class="text-sm font-bold tabular-nums text-emerald">
            {{ item.key + '.period' | transloco }}
          </p>
          <h3 class="mt-2 text-2xl font-semibold leading-tight">
            {{ item.key + '.title' | transloco }}
          </h3>
          <p class="mt-2 text-muted">
            {{ item.key + '.institution' | transloco }}
          </p>
        </li>
      }
    </ul>
  </div>
</section>
