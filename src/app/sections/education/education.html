<section id="education" class="border-t border-white/5 bg-ink-900/40 py-24 sm:py-32">
  <div class="section-container">
    <div class="mb-12 flex flex-col gap-2">
      <span class="section-label">04 — Formazione</span>
      <h2 class="text-3xl sm:text-4xl">Percorso di studi</h2>
    </div>

    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (item of education; track item.title) {
        <div class="card">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-primary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422A12.083 12.083 0 0121 18.75c0 .553-.447 1-1 1H4a1 1 0 01-1-1 12.083 12.083 0 013.84-8.172L12 14z" />
          </svg>
          <h3 class="mt-4 text-lg font-semibold text-white">{{ item.title }}</h3>
          <p class="mt-1 text-sm text-slate-400">{{ item.institution }}</p>
          <p class="mt-3 font-mono text-xs uppercase tracking-widest text-primary-400">{{ item.period }}</p>
        </div>
      }
    </div>
  </div>
</section>
