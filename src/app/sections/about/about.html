<section
  id="about"
  class="section-space border-b border-line"
  aria-labelledby="about-title"
>
  <div class="section-container section-split items-start">
    <div>
      <h2 id="about-title" class="section-heading">
        {{ 'about.title' | transloco }}
      </h2>
      <p class="mt-4 flex items-center gap-2 text-muted">
        <svg
          class="size-5 shrink-0 text-emerald"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <use href="/icons/tabler-outline.svg#map-pin"></use>
        </svg>
        {{ profile.location }}
      </p>
      <svg
        class="section-illustration"
        viewBox="0 0 360 232"
        width="360"
        height="232"
        aria-hidden="true"
        focusable="false"
      >
        <use href="/illustrations/portfolio-sections.svg#profile"></use>
      </svg>
    </div>
    <div class="border-y border-emerald-line bg-emerald-soft p-5 sm:p-8">
      <p class="max-w-prose text-lg leading-relaxed">
        {{ profile.summary | transloco }}
      </p>
      <div class="mt-2 flex flex-wrap gap-x-6">
        <a
          [href]="profile.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          class="text-link text-emerald"
          [attr.aria-label]="'about.ariaLinkedIn' | transloco"
        >
          LinkedIn
        </a>
        <a
          [href]="profile.github"
          target="_blank"
          rel="noopener noreferrer"
          class="text-link text-emerald"
          [attr.aria-label]="'about.ariaGitHub' | transloco"
        >
          GitHub
        </a>
      </div>
      <dl
        class="mt-4 grid grid-cols-3 divide-x divide-emerald-line border-t border-emerald-line pt-4"
      >
        @for (stat of stats; track stat.key) {
          <div
            class="flex min-w-0 flex-col-reverse justify-end px-2 first:pl-0 sm:px-4"
          >
            <dt class="mt-1 break-words text-sm text-muted">
              {{ stat.key | transloco }}
            </dt>
            <dd
              class="font-display text-3xl font-semibold tabular-nums text-emerald sm:text-4xl"
            >
              {{ stat.value }}
            </dd>
          </div>
        }
      </dl>
    </div>
  </div>
</section>
